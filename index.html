<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carta Especial</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #07141d;
    color: white;
    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;
}

.card {
    width: min(92vw, 760px);
    padding: 28px;
    border-radius: 24px;

    background: linear-gradient(
        145deg,
        #092131,
        #031018
    );

    text-align: center;
    box-shadow: 0 0 45px rgba(0,0,0,.7);
}

h1 {
    margin: 0 0 24px;
    font-size: clamp(38px, 8vw, 68px);
}

h1 span {
    color: #aaff00;
}

.window {
    width: min(100%, 590px);
    aspect-ratio: 1.35;

    background: #fff8f4;
    border: 8px solid #ff654d;

    position: relative;
    overflow: hidden;

    color: #5a302b;
}

.bar {
    height: 48px;

    border-bottom: 6px solid #ff654d;

    padding: 8px 14px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    font-weight: 900;
    font-size: 22px;

    color: #ff654d;
}

.content {
    height: calc(100% - 48px);

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 14px;
}

.cat {
    font-size: 70px;
}

.question {
    font-size: clamp(16px, 3.5vw, 24px);
    font-weight: 900;
}

.button-area {
    position: relative;

    width: 90%;
    height: 120px;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 25px;
}

button {
    border: 4px solid #ff654d;

    background: white;
    color: #ff654d;

    font-size: 19px;
    font-weight: 900;

    padding: 10px 25px;

    border-radius: 8px;

    cursor: pointer;

    touch-action: none;
}

#sim:hover {
    transform: scale(1.08);
}

#nao {
    z-index: 5;
}

.success {
    display: none;

    color: #ff654d;

    font-size: 35px;
    font-weight: 900;
}
</style>
</head>

<body>

<div class="card">

    <h1>
        <span>Carta</span> Especial
    </h1>

    <div class="window">

        <div class="bar">
            <span>Love</span>
            <span>— □ ×</span>
        </div>

        <div class="content">

            <div class="cat">
                😺❤️
            </div>

            <div class="question">
                Você aceita ser meu/minha Valentine?
            </div>

            <div class="button-area" id="area">

                <button id="sim">
                    SIM
                </button>

                <button id="nao">
                    NÃO
                </button>

            </div>

            <div class="success" id="success">
                EU SABIA! ❤️
            </div>

        </div>

    </div>

</div>


<script>

const nao = document.getElementById("nao");
const area = document.getElementById("area");

const sim = document.getElementById("sim");
const success = document.getElementById("success");


function fugir(event) {

    event.preventDefault();

    /*
        Transforma o botão em absoluto
        para podermos movimentá-lo livremente.
    */

    nao.style.position = "absolute";


    const areaRect =
        area.getBoundingClientRect();

    const buttonRect =
        nao.getBoundingClientRect();


    /*
        Mantém o botão dentro da área.
    */

    const maxX =
        Math.max(
            0,
            areaRect.width -
            buttonRect.width -
            10
        );

    const maxY =
        Math.max(
            0,
            areaRect.height -
            buttonRect.height -
            10
        );


    const x =
        5 +
        Math.random() * maxX;

    const y =
        5 +
        Math.random() * maxY;


    nao.style.left = x + "px";
    nao.style.top = y + "px";
}


/*
    PC
*/

nao.addEventListener(
    "mouseenter",
    fugir
);

nao.addEventListener(
    "pointerdown",
    fugir
);


/*
    Celular
*/

nao.addEventListener(
    "touchstart",
    fugir,
    {
        passive: false
    }
);


/*
    Botão SIM
*/

sim.addEventListener(
    "click",
    function() {

        nao.style.display = "none";

        sim.style.display = "none";

        success.style.display = "block";

    }
);

</script>

</body>
</html>
