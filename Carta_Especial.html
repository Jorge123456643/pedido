<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carta Especial</title>
<style>
*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:#07141d;color:white;font-family:Arial,sans-serif;display:grid;place-items:center}
.card{width:min(92vw,760px);padding:28px;border-radius:24px;background:linear-gradient(145deg,#092131,#031018);text-align:center;box-shadow:0 0 45px #000}
h1{font-size:clamp(38px,8vw,68px);margin:0 0 24px}h1 span{color:#aaff00}
.win{width:min(100%,590px);aspect-ratio:1.35;background:#fff8f4;border:8px solid #ff654d;position:relative;overflow:hidden;color:#5a302b}
.bar{height:48px;border-bottom:6px solid #ff654d;padding:8px 14px;display:flex;justify-content:space-between;font-weight:900;color:#ff654d;font-size:22px}
.content{height:calc(100% - 48px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.cat{font-size:70px}.q{font-size:clamp(16px,3.5vw,24px);font-weight:900}
.area{position:relative;width:90%;height:110px;display:flex;align-items:center;justify-content:center;gap:25px}
button{border:4px solid #ff654d;background:white;color:#ff654d;font-weight:900;font-size:19px;padding:10px 25px;border-radius:8px;touch-action:none}
#no{z-index:5}.ok{display:none;color:#ff654d;font-size:35px;font-weight:900}
</style></head>
<body><main class="card"><h1><span>Carta</span> Especial</h1>
<div class="win"><div class="bar"><span>Love</span><span>— □ ×</span></div>
<div class="content"><div class="cat">😺❤️</div><div class="q">Você aceita ser meu/minha Valentine?</div>
<div class="area" id="area"><button id="yes">SIM</button><button id="no">NÃO</button></div><div class="ok" id="ok">EU SABIA! ❤️</div></div></div>
</main>
<script>
const no=document.querySelector("#no"),area=document.querySelector("#area"),yes=document.querySelector("#yes"),ok=document.querySelector("#ok");
function fugir(e){
 e.preventDefault();
 if(getComputedStyle(no).position!=="absolute") no.style.position="absolute";
 const r=area.getBoundingClientRect(), b=no.getBoundingClientRect();
 const maxX=Math.max(0,r.width-b.width-10), maxY=Math.max(0,r.height-b.height-10);
 const x=10+Math.random()*maxX, y=5+Math.random()*maxY;
 no.style.left=x+"px";no.style.top=y+"px";
}
["pointerdown","mouseenter","touchstart"].forEach(x=>no.addEventListener(x,fugir,{passive:false}));
yes.onclick=()=>{no.style.display="none";yes.style.display="none";ok.style.display="block"};
</script></body></html>
